<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/layout.ico" type="image/x-icon">
    
    <title>Páginas</title>
    
    
<style>

    * {                             /* para zerar a estilização do navegador*/
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }


    /* !!!!!!!!!!! */
    html, body {
        height: auto;   /* altura */
        margin: 0;      /* margens zerada*/
        padding: 0;     /* espaço interno zerado*/
        color: white; /* cor do texto*/
    }





    /* PÁGINA */
    #pagina {     
        display: flex;          /* display*/
        flex-direction: column; /* direção dos elementos ➡️ em coluna (um abaixo do outro)*/
        
        margin: 30px auto;      /* margens da tabela ➡ 30px top e bottom e auto para right e left*/
        
        width: 95%;     /* largura */
        height: 100%;   /* altura */
    }




    /* CABEÇALHO E RODAPÉ */
    .cabecalho_rodape {             /* cor e altura do cabeçalho e do rodapé*/
        display: flex;              /* display*/
        justify-content: center;    /* centraliza horizontalmente*/
        align-items: center;        /* centraliza verticalmente */

        background-color: #100E09;      /* cor de fundo*/
        height: 100px;                    /* altura*/
    }



    #cabecalho {            /* cabeçalho*/
        padding: 20px;
        text-align: center;
    }

    #rodape {               /* rodapé*/
        /* atualmente sem uso*/
    }





    /* MENU E CONTEÚDO */
    .menu_conteudo {
        display: grid;                          /* display */
        grid-template-columns: 200px auto;      /* divisão das colunas ➡️ para criar o menu lateral e deixar o espaço para o conteúdo */

        min-height: 80vh;                       /* altura mínima ➡️ cresce se precisar*/
    }
    


    /* MENU LATERAL*/
    #menu {
        display: flex;          /* display*/
        flex-direction: column; /* direção dos elementos ➡️ um abaixo do outro*/
        justify-content: left;  /* alinha a esquerda*/

        
        background-color: #292828;  /* cor de fundo*/

        padding-left: 10px; /* espaço interno a esquerda*/
        padding-top: 10px;  /* espaço interno emcima*/
    }

    #menu h1 {                      /* título*/
        align-self: flex-start;     /* para o elemento ocupar apenas o seu espaço*/
        width: 90%;                 /* para não ocupar a linha toda*/ 
        
        font-size: 15pt;            /* tamanho do texto*/
        font-weight: 1000;          /* texto mais gordo ➡ negrito*/

        border-bottom: 1px solid white;     /* boda embaixo do texto*/
        padding-bottom: 10px;                 /* espaço interno embaixo*/

        margin-top: 40px;                     /* para dar um espaço no topo*/
    }

    #menu-lateral button {          /* botões*/
        align-self: flex-start;     /* para o elemento ocupar apenas o seu espaço*/

        font-size: 17pt;            /* tamanho da fonte*/
        padding-left: 30px;         /* espaço interno a esquerda*/

        margin-bottom: 10px;        /* para dar um espaço entre os botões*/

        color: white;             /* cor do texto*/
        font-weight: 1000;          /* negrito*/
        
        background-color: transparent;  /* fundo transparente*/
        border: none;                   /* remove bordas*/

        cursor: pointer;                /* modifica o ponteiro do cursor*/

    }



    /* CONTEÚDO */
    #conteudo {
        background-color: #1c1c1c;  /* cor de fundo*/
    }

        
</style>

</head>
<body>

<div id="pagina">


    <!-- CABEÇALHO -->
    <div id="cabecalho" class="cabecalho_rodape">
        <h1>
            FELIPE GABRIEL ARAÚJO DE FREITAS <br>
            MATHEUS RAMOS LIMA DA SILVA <br>
            PAULO LÁZARO DA ROCHA SOUZA
        </h1>
    </div>



    <div class="menu_conteudo">

        <!-- MENU LATERAL -->
        <div id="menu">

            <h1>PÁGINAS</h1> <br>

            <button onclick="conteudo_fuction('curriculo.htm')">Currículo</button>
            <button onclick="conteudo_fuction('tema_livre.htm')">Player Tauz</button>

        </div>
        


        <!-- CONTEÚDO -->
        <div id="conteudo"></div>

        <!-- script -->
        <script>
            async function conteudo_fuction(arquivo) {
                document.getElementById('conteudo').innerHTML = await (await fetch(arquivo)).text()
            }

        </script>

    </div>


    <!-- RODAPÉ -->
    <div id="rodape" class="cabecalho_rodape">
        <h1>2026</h1>
    </div>

</div>
    
</body>
</html>
